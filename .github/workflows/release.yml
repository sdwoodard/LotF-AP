name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches VERSION
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content -Raw VERSION).Trim()
          if ('${{ github.ref_name }}' -ne $expected) { throw "Expected tag $expected" }
      - name: Build release archives
        shell: pwsh
        run: ./scripts/windows/Build-Release.ps1
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --verify-tag
