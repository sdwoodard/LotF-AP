name: Validate and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        shell: pwsh
        run: ./scripts/windows/Test-Repository.ps1
      - name: Build release archives
        shell: pwsh
        run: ./scripts/windows/Build-Release.ps1 -SkipValidation
      - uses: actions/upload-artifact@v4
        with:
          name: LotF-Archipelago
          path: dist/*
          if-no-files-found: error

  apworld:
    runs-on: ubuntu-latest
    env:
      SKIP_REQUIREMENTS_UPDATE: "1"
    steps:
      - name: Check out integration
        uses: actions/checkout@v4
        with:
          path: lotf-ap
      - name: Check out Archipelago 0.6.7
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          ref: 0.6.7
          path: Archipelago
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Archipelago/requirements.txt
      - name: Install Archipelago dependencies
        working-directory: Archipelago
        run: python -m pip install -r requirements.txt
      - name: Validate Bash scripts and transparent assets
        run: bash lotf-ap/scripts/linux/test-repository.sh
      - name: Check Bash scripts
        run: shellcheck lotf-ap/scripts/linux/*.sh lotf-ap/installer/linux/*.sh
      - name: Build release archives with Bash
        working-directory: lotf-ap
        run: bash ./scripts/linux/build-release.sh --skip-validation
      - name: Install world source
        run: cp -R lotf-ap/worlds/lotf Archipelago/worlds/lotf
      - name: Run world generation tests
        working-directory: Archipelago
        run: python -m unittest worlds.lotf.test.test_generation worlds.lotf.test.test_bridge -v
      - name: Generate the example player file
        working-directory: Archipelago
        run: |
          mkdir -p ../generation-input
          cp "../lotf-ap/player-options/Lords of the Fallen.yaml" "../generation-input/Lampbearer.yaml"
          python Generate.py --player_files_path ../generation-input --outputpath output
