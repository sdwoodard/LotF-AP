# Lords of the Fallen (2023) Archipelago player options
#
# This is a complete, conservative starter file. YAML uses spaces for
# indentation; do not use tabs. Text after a # is a comment and may be changed
# or removed without affecting generation. Boolean options use true/false.
# Choice options use the lowercase values listed in their nearby comments.
# Every eligible pre-placed physical world pickup is always an Archipelago
# check. The tutorial Throwing Stone is the sole deliberate vanilla exception.
# The location-pool options below control additional quest and stigma checks.

# This is the name shown to every player in the multiworld. It must be unique
# within the room. Keep it reasonably short because it appears in item messages.
name: Lampbearer

# A private note for seed organizers. Archipelago does not use this to generate
# the world, so it is safe to replace or remove this text.
description: Default Lords of the Fallen Template

# Do not change this spelling; it selects the installed APWorld.
game: Lords of the Fallen

# Generation should fail clearly instead of using an older Archipelago build
# whose client/APWorld interfaces have not been tested by this project.
requires:
  version: 0.6.7

Lords of the Fallen:
  # Controls how strongly Archipelago tries to distribute important items into
  # earlier spheres. 0 disables balancing, 50 is the community-standard normal
  # value, and values approaching 99 increasingly front-load progression. Very
  # high values reduce seed variety and do not guarantee a particular key early.
  progression_balancing: 50

  # Determines what the generator guarantees can be collected before goal.
  # - items: every advancement item can be reached.
  # - minimal: only enough advancement to complete the selected goal is assured.
  # - full: every location must remain reachable; this is the most restrictive
  #   and is the default while the integration is still being validated.
  accessibility: full

  # Victory condition. Supported values:
  # - any_ending: complete the slot when the credits finish after any ending.
  #   Your beacon and quest choices decide which ending; the seed does not.
  # - all_bosses: soulflay the remembrance stigmas for Pieta, Congregator,
  #   Hushed Saint, Spurned Progeny, Hollow Crow, Unbroken Promise,
  #   Tancred/Reinhold, Judge Cleric, Lightreaper, and Sundered Monarch. Adyr
  #   and Elianne are excluded because they are ending-exclusive. NPC-quest
  #   bosses are excluded because they can be locked out in one playthrough.
  goal: any_ending

  # Adds unique quest-object pickups as Archipelago checks. Every such check is
  # hard-coded filler-only: neither advancement nor useful items can be placed
  # there, even when the quest seems safe, because NPC state and ending choices
  # can make quest objects inaccessible. Disable this for a smaller, cleaner
  # location pool; enabling it is safe for progression but may leave unchecked
  # filler locations after a failed quest.
  include_quest_locations: true

  # Adds one curated, non-boss Umbral stigma per represented area. These are
  # exploration checks and require entering Umbral and soulflaying the stigma.
  # Leave enabled for more checks; disable for a shorter, boss/key-focused seed.
  include_world_stigmas: true

  # Replaces vanilla traversal-key pickups and puts all mapped keys in the
  # multiworld. This exercises the most version-sensitive suppression hook.
  # False leaves vanilla keys untouched and removes their AP route requirements;
  # Disable only when validating a newly released game build or when you want
  # the original key placements instead of the full randomizer experience.
  shuffle_key_items: true

  # Replaces mapped quest-object pickups and puts those objects in the item pool.
  # Although their AP check locations are filler-only, changing NPC/ending state
  # can still invalidate the underlying vanilla quest. This is enabled for the
  # intended full randomizer experience; use fresh, backed-up saves and disable
  # it if the group prefers vanilla quest-object placement.
  shuffle_quest_items: true

  # When key shuffling is on, keep every traversal-key requirement assigned to
  # this LotF player's own world. Disable this to permit those keys to be sent
  # between games like other advancement items in a multiworld. The default is
  # false so a multiworld can create genuine cross-game progression chains.
  local_key_items: false

  # Request an early local Pilgrim's Perch Key when keys are shuffled. This is
  # useful for opening the purchased-key route without waiting on distant games.
  # It has no effect while shuffle_key_items is false. Leave false for normal
  # sphere-based placement and enable only when the group wants this guarantee.
  early_pilgrims_perch_key: false

  # Request an early local Fief Key when keys are shuffled. Enable if early Fief
  # access is preferred; leave false for more routing variety. It has no effect
  # while shuffle_key_items is false.
  early_fief_key: false

  # Adds mapped major-boss remembrances as useful items. These do not unlock AP
  # regions and are not advancement, but they provide build and boss-gear value.
  # Ending-exclusive remembrances can still appear as items; their source checks
  # remain protected and can contain filler only.
  remembrance_items: true

  # Number of Deralium material deliveries mixed into the pool, from 0 through
  # 30. The full default reproduces one normal weapon's vanilla +0-to-+10 cost:
  # 6 Small Fragments (two deliveries of 3), 7 Regular Nuggets, 20 Large Shards,
  # and 1 Chunk. Lower values take the early tiers first and displace less
  # filler; the Chunk is included only at 30.
  weapon_upgrade_items: 30

  # Number of Saintly Quintessences in the pool, from 0 through 20. The default
  # 20 matches the vanilla total needed for all Sanguinarix upgrades. These
  # remain useful rather than advancement.
  sanguinarix_upgrade_items: 20

  # Number of Antediluvian Chisels in the pool, from 0 through 3. The default 3
  # matches the vanilla full-lamp total. Chisels are never required by region
  # logic or either goal.
  lamp_upgrade_items: 3

  # Controls how Vigor Skull values follow the generated route:
  # - off: skull tiers remain fully randomized.
  # - semi: early checks favor smaller skulls and late checks favor larger
  #   skulls, with nearby portions of the curve shuffled for more variety.
  # - full: skulls are arranged as strongly as possible from Enervated and
  #   Faint early to Seething and Replete late. Logical spheres are considered
  #   first, followed by the approximate base-game area order within a sphere.
  # Smoothing can also follow this player's items into another player's world.
  vigor_skull_smoothing: off

  # Controls where the four Deralium tiers are placed:
  # - off: weapon-upgrade materials remain fully randomized.
  # - semi: the overall Small-to-Chunk curve is retained, but nearby portions
  #   are shuffled so occasional higher or lower materials appear sooner/later.
  # - full: Small Fragments are earliest, followed by Regular Nuggets, Large
  #   Shards, and finally Deralium Chunks wherever reachable placements allow.
  # This changes placement only, not weapon_upgrade_items or delivered amounts.
  weapon_upgrade_smoothing: off

  # Treatment of additional unsafe checks (NPC quests, quest objects,
  # missables, ending-exclusive bosses, and any future faction/Crucible
  # source):
  # - forbid_progression: keep the check but permit filler only (recommended).
  # - remove: omit the check entirely.
  # There is intentionally no "allow" value. Code-level rules always reject
  # advancement and useful items at unsafe locations. The 597 fixed physical
  # pickup checks are never removed; unsafe rows within that set stay
  # filler-only so every pickup interaction still reports a randomized check.
  missable_location_behavior: forbid_progression

  # DeathLink mode:
  # - off: local deaths stay local.
  # - any_death: qualifying deaths are sent to the multiworld and received
  #   DeathLinks kill this character. Play offline from the game's own servers.
  death_link: off

  # Number of local deaths, from 1 through 10, required before one DeathLink is
  # sent. 1 sends every death; higher values provide an amnesty buffer. This does
  # not change how received DeathLinks are applied.
  death_link_amnesty: 1

  # Delay in milliseconds between in-game grants, from 250 through 5000. The
  # default 1000 is intentionally gentle on inventory/UI processing. Increase it
  # if rapid multi-item deliveries cause missed popups or instability.
  item_delivery_delay: 1000

  # Give named items to this player at generation start. Example:
  # start_inventory:
  #   Fief Key: 1
  # Do not precollect a shuffled object merely to repair an already-broken quest;
  # always begin each seed with a fresh character/save.
  start_inventory: {}

  # Force named checks to filler-only in addition to the APWorld's hard safety
  # list. This cannot weaken protection on quest, faction, Crucible, or ending-
  # exclusive checks. Use exact location names from the generated template.
  exclude_locations: []

  # Ask the generator to favor useful/advancement items at named safe checks.
  # Priority does not override a location's access rule or hard safety rule.
  priority_locations: []

  # Keep the named items in this player's own LotF world. The local_key_items
  # option above is the convenient way to localize every traversal requirement.
  local_items: []

  # Require named items to be found in another player's world. Do not list an
  # item in both local_items and non_local_items, and avoid forcing route keys
  # remote unless the multiworld group explicitly wants that dependency.
  non_local_items: []

  # Reveal the recipient/location relationship for these item names when the
  # room starts. Hints do not move items. Example: ["Fief Key", "Rune of Adyr"]
  start_hints: []

  # Reveal what is placed at these exact location names when the room starts.
  # This is helpful for accessibility planning without excluding the check.
  start_location_hints: []
